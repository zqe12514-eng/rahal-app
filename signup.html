<!doctype html><html dir="rtl" lang="ar"><head><script id="rahal-theme-early">(function(){try{var t=localStorage.getItem("rahal-theme");document.documentElement.classList.toggle("light",t==="light");}catch(e){}})();</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0788c8"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"><script src="auth.js"></script><title>إنشاء حساب — رحّال</title></head>
<body class="auth-page">
<main class="auth-shell"><section class="auth-visual"><div class="auth-brand"><span>🧭</span><b>رحّال</b></div><div><small>اكتشف .. استكشف .. سافر</small><h1>أنشئ حسابك في رحّال.</h1><p>احفظ وجهاتك المفضلة ورحلاتك وإعداداتك لتعود إليها بسهولة.</p></div><a href="welcome.html" class="auth-back">← العودة إلى رحّال</a></section>
<section class="auth-card"><div class="auth-logo">🧭</div><h2>إنشاء حساب جديد</h2><p class="auth-muted">بياناتك تحفظ محليًا على هذا الجهاز في النسخة التجريبية.</p><form id="signupForm" class="auth-form"><label>الاسم الكامل<input id="name" required autocomplete="name" placeholder="اكتب اسمك الكامل"></label><label>البريد الإلكتروني أو رقم الهاتف<input id="contact" required autocomplete="username" placeholder="example@email.com أو 7xxxxxxxx"></label><label>كلمة المرور<div class="password-field"><input id="password" required type="password" minlength="6" autocomplete="new-password" placeholder="6 أحرف أو أكثر"><button type="button" data-toggle-password="password">👁</button></div></label><label>تأكيد كلمة المرور<div class="password-field"><input id="confirm" required type="password" minlength="6" autocomplete="new-password" placeholder="أعد كتابة كلمة المرور"><button type="button" data-toggle-password="confirm">👁</button></div></label><button class="auth-primary" type="submit">إنشاء الحساب</button></form><div class="auth-divider"><span>أو</span></div><button class="google-btn" id="googleSignup" type="button">G <span>إنشاء حساب بحساب Google</span></button><p class="auth-switch">لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a></p><p class="auth-guest"><a href="index.html">متابعة بدون حساب</a></p></section></main>
<script>
document.getElementById('signupForm').addEventListener('submit',async e=>{e.preventDefault();const name=document.getElementById('name').value.trim();const contact=document.getElementById('contact').value.trim();const p=document.getElementById('password').value;const c=document.getElementById('confirm').value;if(p!==c){RahalAuth.notify('كلمتا المرور غير متطابقتين.');return}const old=RahalAuth.account();if(old&&RahalAuth.normalize(old.contact)===RahalAuth.normalize(contact)){RahalAuth.notify('يوجد حساب بهذه البيانات على هذا الجهاز.');return}RahalAuth.saveAccount({name,contact,passwordHash:await RahalAuth.hash(p),createdAt:new Date().toISOString()});RahalAuth.setSession(true);location.href='profile.html'});
document.querySelectorAll('[data-toggle-password]').forEach(b=>b.onclick=()=>{const i=document.getElementById(b.dataset.togglePassword);i.type=i.type==='password'?'text':'password'});document.getElementById('googleSignup').onclick=()=>RahalAuth.notify('إنشاء حساب Google يحتاج ربط خدمة مصادقة حقيقية مثل Firebase أو Supabase.');
</script></body></html>
