   <header class="topbar"><button class="menu-toggle" id="menuToggle" aria-label="فتح القائمة" aria-expanded="false"><span></span><span></span><span></span></button><a class="account-avatar-btn" data-account-link href="profile.html" aria-label="الحساب" title="الحساب"><span data-account-avatar>👤</span></a>

    <div class="actions">
     <button class="circle" id="themeBtn">
      ☼
     </button>
     <button class="circle" id="notifyBtn">

     </button>
     <span>
      زكريا
     </span>
    </div>
   </header>
   <section class="content">
    <h1>
     📷 الصور
    </h1>
    <div class="panel">
     <p>
      📷 التقط صور رحلاتك واحفظها على جهازك. تعمل الكاميرا عند استخدام HTTPS أو localhost ومنح الإذن.
     </p>
     <button class="btn primary" id="cameraBtn">
      📷 فتح الكاميرا
     </button>
     <input accept="image/*" capture="environment" hidden="" id="fileInput" type="file"/>
     <button class="btn" id="uploadBtn">
      ⬆️ إضافة صورة
     </button>
     <div hidden="" id="cameraBox" style="margin-top:12px">
      <video autoplay="" id="video" playsinline="" style="width:100%;max-height:420px;border-radius:16px">
      </video>
      <br/>
      <button class="btn primary" id="captureBtn">
       📸 التقاط
      </button>
      <button class="btn" id="closeCamera">
       إغلاق
      </button>
      <canvas hidden="" id="canvas">
      </canvas>
     </div>
    </div>
    <br/>
    <div class="grid" id="photoGrid">
    </div>
    <script>
     document.addEventListener("DOMContentLoaded",()=>{
 const grid=document.getElementById("photoGrid"), input=document.getElementById("fileInput");
 function render(saved=[]){grid.innerHTML=allDestinations().slice(0,12).map(d=>`<article class="card"><img src="${d.img}" alt="${d.city}"><div class="cardbody"><b>${d.flag} ${d.city}</b></div></article>`).join("")+saved.map(x=>`<article class="card"><img src="${x.data}" style="width:100%;max-height:260px;object-fit:cover;border-radius:12px"><div class="cardbody"><b>📷 صور رحلاتي</b></div></article>`).join("")}
 RahalDevice.photos().then(render).catch(()=>render([]));
 let stream;
 cameraBtn.onclick=async()=>{try{if(!navigator.mediaDevices?.getUserMedia)throw Error();stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false});video.srcObject=stream;cameraBox.hidden=false}catch(e){input.click();}};
 uploadBtn.onclick=()=>input.click();
 input.onchange=()=>{const f=input.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>RahalDevice.savePhoto(r.result).then(()=>RahalDevice.photos()).then(render);r.readAsDataURL(f)};
 captureBtn.onclick=()=>{canvas.width=video.videoWidth;canvas.height=video.videoHeight;canvas.getContext("2d").drawImage(video,0,0);RahalDevice.savePhoto(canvas.toDataURL("image/jpeg",.88)).then(()=>RahalDevice.photos()).then(render);RahalDevice.vibrate(30)};
 closeCamera.onclick=()=>{stream?.getTracks().forEach(t=>t.stop());cameraBox.hidden=true};
});
    </script>
   </section>
