<!doctype html><html dir="rtl" lang="ar"><head><script id="rahal-theme-early">(function(){try{var t=localStorage.getItem("rahal-theme");document.documentElement.classList.toggle("light",t==="light");}catch(e){}})();</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0788c8"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"><script src="auth.js"></script><title>استعادة كلمة المرور — رحّال</title></head><body class="auth-page">
<main class="auth-shell"><section class="auth-visual"><div class="auth-brand"><span>🧭</span><b>رحّال</b></div><div><small>رحّال Explorer</small><h1>استعد الوصول إلى حسابك.</h1><p>في النسخة المحلية، يمكنك تعيين كلمة مرور جديدة بعد التحقق من بيانات الحساب المحفوظة على الجهاز.</p></div><a href="welcome.html" class="auth-back">← العودة إلى رحّال</a></section><section class="auth-card"><div class="auth-logo">🔐</div><h2>استعادة كلمة المرور</h2><p class="auth-muted">أدخل البريد أو رقم الهاتف المستخدم عند التسجيل.</p><form id="forgotForm" class="auth-form"><label>البريد الإلكتروني أو رقم الهاتف<input id="contact" required></label><label>كلمة المرور الجديدة<input id="password" required type="password" minlength="6" placeholder="6 أحرف أو أكثر"></label><label>تأكيد كلمة المرور<input id="confirm" required type="password" minlength="6"></label><button class="auth-primary" type="submit">تعيين كلمة مرور جديدة</button></form><p class="auth-switch"><a href="login.html">← العودة لتسجيل الدخول</a></p></section></main><script>document.getElementById('forgotForm').addEventListener('submit',async e=>{e.preventDefault();const a=RahalAuth.account();const c=document.getElementById('contact').value.trim(),p=document.getElementById('password').value;if(!a||RahalAuth.normalize(a.contact)!==RahalAuth.normalize(c)){RahalAuth.notify('لم نجد حسابًا بهذه البيانات على هذا الجهاز.');return}if(p!==document.getElementById('confirm').value){RahalAuth.notify('كلمتا المرور غير متطابقتين.');return}a.passwordHash=await RahalAuth.hash(p);RahalAuth.saveAccount(a);RahalAuth.setSession(true);location.href='profile.html'});</script></body></html>
